services:
  - type: web
    name: shree-siddhivinayak-mandir
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MANDAL_UPI_ID
        value: 9029359525m@pnb
      - key: MANDAL_PAYEE_NAME
        value: Shree Siddhivinayak Mandir
      - key: UPLOAD_DIR
        value: /app/server/data/uploads
    disk:
      name: mandal-persistent-data
      mountPath: /app/server/data
      sizeGB: 1


