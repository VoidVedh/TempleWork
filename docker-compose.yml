services:
  siddhivinayak-mandir:
    build:
      context: .
      dockerfile: Dockerfile
    image: siddhivinayak-mandir:production
    container_name: siddhivinayak-mandir-app
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - JWT_SECRET=ekdant-prod-jwt-secret-replace-with-custom-value
      - MANDAL_UPI_ID=ganjaleshivam720-1@oksbi
      - MANDAL_PAYEE_NAME=Shree Siddhivinayak Mandir
    volumes:
      # Persistent Storage Mounts for SQLite Database and File Uploads
      - ./server/data:/app/server/data
      - ./server/uploads:/app/server/uploads
